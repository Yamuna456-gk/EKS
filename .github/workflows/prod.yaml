name: "Terraform - PROD (Manual Approval)"

on:
  push:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'environments/prod/**'
  workflow_dispatch:  # Allow manual trigger

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "environments/prod"

jobs:
  # ================================
  # JOB 1: Terraform Plan
  # ================================
  terraform-plan:
    name: "Plan - Prod"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -no-color \
            -var="asg_ami_id=${{ secrets.PROD_AMI_ID }}" \
            -var="key_name=${{ secrets.PROD_KEY_NAME }}" \
            -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: ${{ env.WORKING_DIR }}/tfplan

  # ================================
  # JOB 2: Manual Approval Gate
  # ================================
  approval:
    name: "⏳ Waiting for Approval"
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production  # ← This triggers manual approval

    steps:
      - name: Approval Granted
        run: echo "✅ Production deployment approved!"

  # ================================
  # JOB 3: Terraform Apply (After Approval)
  # ================================
  terraform-apply:
    name: "Apply - Prod"
    runs-on: ubuntu-latest
    needs: approval

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ap-southeast-2

      - name: Terraform Init
        run: terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
